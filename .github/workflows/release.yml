name: Release

# Publica um módulo quando uma tag de versão é enviada:
#   <pasta-do-módulo>-v<versão>, ex.: monolith-regras-v0.3.0, monolith-reach-v0.1.0
#   monolith-calendario é compilado e testado antes; o Item Piles embutido no monolith-itemizador
#   (pasta pilhas/) é compilado e vai sem o código-fonte; os outros são empacotados como estão.
# A versão da tag precisa ser igual à "version" do module.json do módulo.

on:
  push:
    tags:
      - 'monolith-*-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Identificar o módulo
        id: mod
        run: |
          TAG="${GITHUB_REF_NAME}"
          MOD="${TAG%%-v[0-9]*}"
          if [ ! -f "$MOD/module.json" ]; then echo "Pasta de módulo não encontrada para a tag: $TAG"; exit 1; fi
          VER="${TAG#${MOD}-v}"
          JSONVER=$(jq -r .version "$MOD/module.json")
          if [ "$VER" != "$JSONVER" ]; then echo "A tag ($VER) não bate com module.json ($JSONVER)"; exit 1; fi
          echo "mod=$MOD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Node
        if: steps.mod.outputs.mod == 'monolith-calendario'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monolith-calendario/package-lock.json

      - name: Compilar e testar o calendário
        if: steps.mod.outputs.mod == 'monolith-calendario'
        working-directory: monolith-calendario
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          cp README-MONOLITH.md dist/README.md
          rm -f dist/*.map
          mkdir -p ../build
          mv dist ../build/monolith-calendario

      - name: Node (pilhas do Itemizador)
        if: steps.mod.outputs.mod == 'monolith-itemizador'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monolith-itemizador/pilhas/package-lock.json

      - name: Compilar as pilhas do Itemizador
        if: steps.mod.outputs.mod == 'monolith-itemizador'
        working-directory: monolith-itemizador/pilhas
        run: |
          npm ci --ignore-scripts
          npm run build
          test -s dist/pilhas.js && test -s dist/pilhas.css
          mkdir -p ../../build
          cp -r .. ../../build/monolith-itemizador
          cd ../../build/monolith-itemizador/pilhas
          rm -rf src node_modules .vite-cache package.json package-lock.json vite.config.mjs .gitignore dist/*.map

      - name: Empacotar módulo sem compilação
        if: steps.mod.outputs.mod != 'monolith-calendario' && steps.mod.outputs.mod != 'monolith-itemizador'
        env:
          MOD: ${{ steps.mod.outputs.mod }}
        run: |
          mkdir -p build
          cp -r "$MOD" "build/$MOD"

      - name: Zip e release
        env:
          GH_TOKEN: ${{ github.token }}
          MOD: ${{ steps.mod.outputs.mod }}
          TAG: ${{ steps.mod.outputs.tag }}
        run: |
          cd build
          zip -qr "$MOD.zip" "$MOD"
          cp "$MOD/module.json" module.json
          gh release create "$TAG" "$MOD.zip" module.json --title "$TAG" --notes "Instale pelo manifest: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/$MOD/module.json"
