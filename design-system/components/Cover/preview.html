<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Monolith</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--void-000); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .blood { fill:var(--blood-500); }
  .cobalt { fill:var(--cobalt-500); }
  .stone { fill:var(--void-300); }
  .wash { fill:var(--blood-wash); }
  .slab { rx:var(--radius-none); }
  .rule { stroke:var(--void-000); stroke-width:1; }
  .rule.on-ground { stroke:var(--void-400); }
  .words { position:absolute; left:32px; bottom:32px; max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:120px; line-height:.9; font-weight:400; letter-spacing:.02em; color:var(--ink); }
  .tag { margin:12px 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      blood-500 96×288 bled off the top (the brand, tallest stone) · cobalt-500 64×208 · void-300 128×160 (the stone itself) · blood-wash 32×96 as relief — ≈30% of 960×288
  arrangement standing stones of unequal height on one ground line space-8 above the bottom edge, space-4 gutters, the last bleeding off the right edge
  pattern     hairline rules, from "monoliths have no soft edges" and the tall, condensed Bebas Neue titles: four incised lines at a space-6 pitch cut across the stones like carved text, one continuing onto the ground
  scales      sides in space-8 multiples; gutters space-4; rule pitch space-6; corners radius-none everywhere
-->
<rect class="wash slab"   x="32"  y="160" width="32"  height="96"  rx="0"/>
<rect class="blood slab"  x="80"  y="-32" width="96"  height="288" rx="0"/>
<rect class="cobalt slab" x="192" y="48"  width="64"  height="208" rx="0"/>
<rect class="stone slab"  x="272" y="96"  width="128" height="160" rx="0"/>
<rect class="blood slab"  x="416" y="128" width="96"  height="128" rx="0"/>
<line class="rule" x1="96"  y1="136" x2="160" y2="136"/>
<line class="rule" x1="96"  y1="160" x2="160" y2="160"/>
<line class="rule" x1="96"  y1="184" x2="144" y2="184"/>
<line class="rule" x1="288" y1="136" x2="384" y2="136"/>
<line class="rule on-ground" x1="0" y1="256" x2="480" y2="256"/>
</svg>
</div>
<div class="words">
  <h1 class="name">MONOLITH</h1>
  <p class="tag">Grimdark e terror para os módulos de Foundry.</p>
</div>
</div>
</body>
</html>
